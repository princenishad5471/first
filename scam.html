<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>

<style>
    body {
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: pink;
        font-family: Arial, sans-serif;
    }

    .box {
        text-align: center;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    h1 {
        margin-bottom: 20px;
    }

    button {
        padding: 10px 20px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px;
    }

    #yes {
        background: #ff4d6d;
        color: white;
    }

    #no {
        background: #555;
        color: white;
        position: absolute;
    }
</style>
</head>

<body>

<div class="box">
    <h1>Will you be my Valentine? 💖</h1>
    <button id="yes" onclick="yesClicked()">Yes 💕</button>
    <button id="no">No 😜</button>
</div>

<script>
    const noBtn = document.getElementById("no");

    // Make NO button run away
    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    // YES button action
    function yesClicked() {
        document.body.innerHTML = `
            <div style="
                height:100vh;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                background:pink;
                font-family:Arial;
                text-align:center;
            ">
                <h1>YAYYYY!! 💖💖💖</h1>
                <h2>You are my Valentine 😘🌹</h2>
                <p style="font-size:40px;">🥰💘😍💞💐</p>
                <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
                     alt="Love GIF"
                     style="width:250px;border-radius:15px;">
            </div>
        `;
    }
</script>

</body>
</html>
